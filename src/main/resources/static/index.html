<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoS Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1200px; }
    </style>
</head>
<body>

<div class="container mt-4">

    <div id="login-view">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">PoS Terminal Login</h1>
                        <div class="form-group mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" value="staff" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" value="password" required>
                        </div>
                        <div class="d-grid">
                            <button id="login-btn" class="btn btn-primary">Login</button>
                        </div>
                        <div id="login-error" class="text-danger mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="pos-view" class="d-none">
        <header class="d-flex justify-content-between align-items-center p-3 mb-4 bg-white rounded shadow-sm">
            <h2 class="h5 mb-0">PoS Dashboard</h2>
            <div>
                <span class="me-3">Welcome, <strong id="currentUser"></strong>!</span>
                <button id="logout-btn" class="btn btn-danger btn-sm">Logout</button>
            </div>
        </header>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">New Sale</h5>
                        <div class="input-group mb-3">
                            <input type="text" id="product-search" class="form-control" placeholder="Search products by name...">
                            <button id="product-search-btn" class="btn btn-outline-secondary">Search</button>
                        </div>
                        <ul id="product-search-results" class="list-group mb-3"></ul>

                        <hr>

                        <h5 class="card-title">Current Cart</h5>
                        <ul id="cart-items" class="list-group mb-3">
                        </ul>
                        <div class="fs-5 fw-bold text-end">Total: <span id="total-price">$0.00</span></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Customer</h5>
                        <div class="input-group mb-3">
                            <input type="text" id="customer-phone" class="form-control" placeholder="Lookup customer by phone...">
                            <button id="customer-lookup-btn" class="btn btn-outline-secondary">Find</button>
                        </div>
                        <div id="customer-info" class="mb-3">
                        </div>
                        <hr>
                        <h6 class="card-subtitle mb-2 text-muted">New Customer?</h6>
                        <div class="input-group">
                            <label for="new-customer-name"></label><input type="text" id="new-customer-name" class="form-control" placeholder="New Customer Name">
                            <label for="new-customer-phone"></label><input type="text" id="new-customer-phone" class="form-control" placeholder="New Customer Phone">
                            <button id="create-customer-btn" class="btn btn-outline-success">Register</button>
                        </div>
                    </div>
                </div>

                <div class="d-grid">
                    <button id="create-order-btn" class="btn btn-success btn-lg">Complete Sale</button>
                </div>
            </div>
        </div>

        <div id="admin-view" class="mt-5 d-none">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Admin Panel: Staff Management</h5>
                </div>
            </div>
        </div>
    </div>

</div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
