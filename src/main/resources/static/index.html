<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoS Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        h1, h2 { color: #2c3e50; }
        #login-view, #pos-view { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #f9f9f9; }
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        #cart-items { list-style-type: none; padding: 0; }
        #cart-items li { background-color: #fff; border: 1px solid #ddd; padding: 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        #total-price { font-weight: bold; font-size: 1.2em; text-align: right; margin-top: 10px; }
        .error { color: #e74c3c; font-weight: bold; }
        .success { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <h1>PoS Terminal</h1>
    <div id="message-area"></div>

    <div id="login-view">
        <h2>Staff Login</h2>
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="staff" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="password" required>
        </div>
        <button id="login-btn">Login</button>
    </div>

    <div id="pos-view" class="hidden">
        <h2>Create New Sale</h2>
        <div style="display: flex; gap: 10px; align-items: flex-end;">
            <div class="form-group" style="flex-grow: 1;">
                <label for="product-id">Product ID:</label>
                <input type="number" id="product-id" placeholder="Enter Product ID and press Enter">
            </div>
             <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" value="1" min="1">
            </div>
            <button id="add-product-btn">Add to Cart</button>
        </div>

        <hr>

        <h2>Current Cart</h2>
        <ul id="cart-items">
            </ul>
        <div id="total-price">Total: $0.00</div>
        <br>
        <button id="create-order-btn" style="width: 100%; background-color: #27ae60;">Create Order</button>
        <button id="logout-btn" style="width: 100%; background-color: #c0392b; margin-top: 10px;">Logout</button>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- STATE MANAGEMENT ---
    const state = {
        currentUser: null,
        cart: [], // Will store objects of { productId, name, price, quantity }
    };

    // --- DOM ELEMENTS ---
    const loginView = document.getElementById('login-view');
    const posView = document.getElementById('pos-view');
    const messageArea = document.getElementById('message-area');

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    const productIdInput = document.getElementById('product-id');
    const quantityInput = document.getElementById('quantity');
    const addProductBtn = document.getElementById('add-product-btn');
    
    const cartItemsList = document.getElementById('cart-items');
    const totalPriceEl = document.getElementById('total-price');
    const createOrderBtn = document.getElementById('create-order-btn');

    // --- API FUNCTIONS ---

    // Function to handle API requests
    const apiRequest = async (endpoint, options = {}) => {
        try {
            const response = await fetch(`/api${endpoint}`, options);
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ message: `HTTP error! status: ${response.status}` }));
                throw new Error(errorData.message || 'An unknown error occurred.');
            }
            // Handle no content response
            if (response.status === 204 || response.headers.get("Content-Length") === "0") {
                return null;
            }
            return await response.json();
        } catch (error) {
            console.error('API Request Error:', error);
            showMessage(error.message, 'error');
            throw error;
        }
    };
    
    // Login the user
    const login = async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        try {
            // Note: Your backend seems to have an issue where /login doesn't return the user object directly.
            // A better approach would be to have a /api/auth/me endpoint to get the current user.
            // For now, we'll just assume login is successful and proceed.
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            if (!response.ok) {
                throw new Error('Invalid username or password.');
            }
            
            // A real app would get user data from the login response.
            // We'll hardcode a temporary user object.
            state.currentUser = { username }; 
            updateUI();
            showMessage(`Welcome, ${username}!`, 'success');
        } catch (error) {
            showMessage(error.message, 'error');
        }
    };
    
    // Logout the user
    const logout = async () => {
        try {
            await fetch('/api/auth/logout', { method: 'POST' });
            state.currentUser = null;
            resetCart();
            updateUI();
            showMessage('You have been logged out.', 'success');
        } catch (error) {
            showMessage('Logout failed.', 'error');
        }
    };

    // Fetch a single product by its ID
    const getProductById = async (id) => {
        try {
            return await apiRequest(`/products/${id}`);
        } catch (error) {
            showMessage(`Product with ID ${id} not found.`, 'error');
            return null;
        }
    };

    // --- UI & LOGIC FUNCTIONS ---

    // Add a product to the cart
    const addProductToCart = async () => {
        const productId = parseInt(productIdInput.value, 10);
        const quantity = parseInt(quantityInput.value, 10);

        if (isNaN(productId) || isNaN(quantity) || quantity < 1) {
            showMessage('Please enter a valid Product ID and quantity.', 'error');
            return;
        }

        const product = await getProductById(productId);
        if (!product) return;

        // Check if item is already in cart
        const existingItem = state.cart.find(item => item.productId === productId);
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            state.cart.push({
                productId: product.id,
                name: product.name,
                price: product.price,
                quantity: quantity,
            });
        }
        
        // Clear inputs and re-render
        productIdInput.value = '';
        quantityInput.value = '1';
        productIdInput.focus();
        renderCart();
    };

    // Create the order
    const createOrder = async () => {
        if (state.cart.length === 0) {
            showMessage('Cannot create an empty order. Please add products to the cart.', 'error');
            return;
        }
        
        // The API expects a list of order items
        const orderDetails = {
            items: state.cart.map(item => ({
                productId: item.productId,
                quantity: item.quantity,
                price: item.price // Sending price at time of sale
            }))
        };
        
        try {
            const newOrder = await apiRequest('/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderDetails)
            });
            showMessage(`Order #${newOrder.id} created successfully!`, 'success');
            resetCart();
        } catch(error) {
            showMessage(`Failed to create order: ${error.message}`, 'error');
        }
    };

    // Display messages to the user
    const showMessage = (message, type = 'info') => {
        messageArea.textContent = message;
        messageArea.className = type; // 'error' or 'success'
        setTimeout(() => messageArea.textContent = '', 5000);
    };

    // Reset cart state and UI
    const resetCart = () => {
        state.cart = [];
        renderCart();
    };

    // Update UI based on login state
    const updateUI = () => {
        if (state.currentUser) {
            loginView.classList.add('hidden');
            posView.classList.remove('hidden');
            productIdInput.focus();
        } else {
            loginView.classList.remove('hidden');
            posView.classList.add('hidden');
        }
    };

    // Re-render the cart in the UI
    const renderCart = () => {
        cartItemsList.innerHTML = '';
        let totalPrice = 0;
        
        state.cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            totalPrice += itemTotal;
            const li = document.createElement('li');
            li.textContent = `${item.name} (x${item.quantity}) - $${itemTotal.toFixed(2)}`;
            cartItemsList.appendChild(li);
        });
        
        totalPriceEl.textContent = `Total: $${totalPrice.toFixed(2)}`;
    };

    // --- EVENT LISTENERS ---
    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    addProductBtn.addEventListener('click', addProductToCart);
    createOrderBtn.addEventListener('click', createOrder);

    // Allow pressing Enter in the product ID field to add to cart
    productIdInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault(); // Prevents form submission
            addProductToCart();
        }
    });

    // --- INITIALIZATION ---
    updateUI();
});
</script>

</body>
</html>
