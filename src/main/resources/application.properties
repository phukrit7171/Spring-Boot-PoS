# --- H2 Database Configuration ---
# Enable the H2 console so you can view the database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA & Hibernate Configuration ---
# The H2 dialect is auto-detected, but being explicit is fine.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# This will automatically create your database schema from your @Entity classes on startup.
# 'create-drop' is perfect for development as the DB is reset on each restart.
spring.jpa.hibernate.ddl-auto=create-drop
# Show the generated SQL in the console for easy debugging.
spring.jpa.show-sql=true

# --- Data Initialization ---
# Initialize the database after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
# Enable detailed logging for data initialization
logging.level.org.springframework.boot.autoconfigure.sql.init=DEBUG

# --- Default User for Spring Security ---
# For rapid development, set a default user and password.
spring.security.user.name=admin
spring.security.user.password=password
spring.security.user.roles=ADMIN

# --- Logging Configuration ---
# Set the logging level for the application.
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- JWT Configuration ---
jwt.secret=dGVzdGluZ0p3dFNlY3JldEtleUZvclNwcmluZ0Jvb3RQb1NTeXN0ZW1BcHBsaWNhdGlvbjEyMzQ1Njc4OTA=
jwt.expiration=28800000

# --- Server Configuration ---
server.port=8080
