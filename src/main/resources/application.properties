# --- H2 Database Configuration ---
# Enable the H2 console so you can view the database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA & Hibernate Configuration ---
# The H2 dialect is auto-detected, but being explicit is fine.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# This will automatically create your database schema from your @Entity classes on startup.
# 'create-drop' is perfect for development as the DB is reset on each restart.
spring.jpa.hibernate.ddl-auto=create-drop
# Show the generated SQL in the console for easy debugging.
spring.jpa.show-sql=true

# --- Default User for Spring Security ---
# For rapid development, set a default user and password.
spring.security.user.name=admin
spring.security.user.password=password
spring.security.user.roles=ADMIN


# --- Logging Configuration ---
# Set the logging level for the application.
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Server Configuration ---
server.port=8080